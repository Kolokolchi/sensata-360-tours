<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0b0c10" />
<title>Sensata Group — 3D-туры 360°</title>
<style>
  :root { --bg:#0b0c10; --ink:#f4f1ea; --dim:#9aa0ab; --gold:#c5a47e; --gold2:#e7cfa9; --line:rgba(255,255,255,.1); --rail:68px; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }

  /* ---------- Cover: five panels, one window ---------- */
  .cover { position:fixed; inset:0; display:flex; flex-direction:column; transition:opacity .45s ease, visibility .45s; }
  body.in-tour .cover { opacity:0; visibility:hidden; pointer-events:none; }
  .top { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:clamp(18px,3.2vh,34px) clamp(18px,3vw,44px) clamp(12px,2vh,22px); }
  .brand { display:flex; flex-direction:column; gap:6px; }
  .brand small { font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .brand h1 { font-size:clamp(30px,5.4vw,84px); line-height:.9; font-weight:800; letter-spacing:-.035em; text-transform:uppercase; }
  .brand h1 em { font-style:normal; color:transparent; -webkit-text-stroke:1.5px var(--gold); }
  .lede { max-width:30ch; text-align:right; font-size:clamp(12px,1.05vw,15px); line-height:1.45; color:var(--dim); }
  .lede b { color:var(--ink); font-weight:600; }

  .panels { flex:1; min-height:0; display:flex; gap:6px; padding:0 clamp(10px,1.4vw,20px) clamp(10px,1.4vw,20px); }
  .panel { position:relative; flex:1 1 0; min-width:0; overflow:hidden; border-radius:22px; text-align:left; isolation:isolate; transition:flex-grow .55s cubic-bezier(.2,.8,.2,1); outline-offset:3px; }
  .panel:hover, .panel:focus-visible { flex-grow:2.6; }
  .panel img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; transform:scale(1.06); filter:saturate(.82) brightness(.74); transition:transform 1.1s cubic-bezier(.2,.8,.2,1), filter .5s; }
  .panel:hover img, .panel:focus-visible img { transform:scale(1); filter:saturate(1.05) brightness(.98); }
  .panel::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(11,12,16,.5) 0%, rgba(11,12,16,0) 30%, rgba(11,12,16,0) 46%, rgba(11,12,16,.93) 100%); }
  .num { position:absolute; top:16px; left:18px; font-size:clamp(34px,4.6vw,72px); font-weight:800; line-height:1; letter-spacing:-.05em; color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.82); transition:color .35s, -webkit-text-stroke-color .35s; }
  .panel:hover .num, .panel:focus-visible .num { color:var(--gold); -webkit-text-stroke-color:var(--gold); }
  .badge { position:absolute; top:22px; right:16px; padding:5px 11px; border-radius:999px; background:rgba(11,12,16,.55); border:1px solid rgba(197,164,126,.6); color:var(--gold2); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; backdrop-filter:blur(8px); opacity:0; transform:translateY(-6px); transition:opacity .35s, transform .35s; }
  .panel:hover .badge, .panel:focus-visible .badge { opacity:1; transform:none; }
  .meta { position:absolute; left:18px; right:18px; bottom:18px; display:flex; flex-direction:column; gap:8px; }
  .meta h2 { font-size:clamp(17px,1.75vw,30px); font-weight:800; letter-spacing:-.01em; line-height:1.05; text-transform:uppercase; overflow-wrap:anywhere; }
  .more { display:grid; grid-template-rows:0fr; transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1); }
  .more > div { overflow:hidden; display:flex; flex-direction:column; gap:10px; }
  .panel:hover .more, .panel:focus-visible .more { grid-template-rows:1fr; }
  .addr { font-size:13px; color:#d3d6dc; }
  .empty { margin:auto; color:var(--dim); font-size:18px; }
  .facts { display:flex; flex-wrap:wrap; gap:6px; }
  .facts span { font-size:11px; font-weight:600; padding:4px 9px; border-radius:8px; background:rgba(255,255,255,.1); backdrop-filter:blur(6px); white-space:nowrap; }
  .go { align-self:flex-start; margin-top:2px; display:inline-flex; align-items:center; gap:10px; padding:11px 18px; border-radius:999px; background:var(--gold); color:#0b0c10; font-weight:800; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .go svg { width:16px; height:16px; }
  .foot { position:absolute; left:0; right:0; bottom:2px; text-align:center; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.28); pointer-events:none; }

  /* ---------- Tour: rail + stage ---------- */
  .tour { position:fixed; inset:0; display:flex; opacity:0; visibility:hidden; transition:opacity .45s ease, visibility .45s; }
  body.in-tour .tour { opacity:1; visibility:visible; }
  .rail { width:var(--rail); flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 0; background:#0b0c10; border-right:1px solid var(--line); z-index:2; }
  .rail .home { width:44px; height:44px; border-radius:14px; display:grid; place-items:center; color:var(--gold); border:1px solid rgba(197,164,126,.45); margin-bottom:8px; transition:background .2s, color .2s; }
  .rail .home:hover { background:var(--gold); color:#0b0c10; }
  .rail .home svg { width:20px; height:20px; }
  .tab { position:relative; width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-weight:800; font-size:15px; letter-spacing:-.02em; color:var(--dim); transition:background .2s, color .2s; }
  .tab:hover { background:rgba(255,255,255,.08); color:var(--ink); }
  .tab[aria-current="true"] { background:var(--gold); color:#0b0c10; }
  .tab .tip { position:absolute; left:calc(100% + 12px); top:50%; transform:translateY(-50%) translateX(-4px); padding:8px 12px; border-radius:10px; background:#15171d; border:1px solid var(--line); color:var(--ink); font-size:12px; font-weight:600; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .tab:hover .tip, .tab:focus-visible .tip { opacity:1; transform:translateY(-50%); }
  .rail .spacer { flex:1; }
  .rail .mark { writing-mode:vertical-rl; transform:rotate(180deg); font-size:10px; letter-spacing:.34em; text-transform:uppercase; color:rgba(255,255,255,.3); padding-bottom:6px; }
  .stage { position:relative; flex:1; min-width:0; background:#0d0e12; }
  .stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .veil { position:absolute; inset:0; display:grid; place-items:center; background:#0d0e12; transition:opacity .5s ease, visibility .5s; }
  .veil.hide { opacity:0; visibility:hidden; }
  .veil div { text-align:center; }
  .veil b { display:block; font-size:clamp(22px,3.4vw,46px); font-weight:800; letter-spacing:-.02em; text-transform:uppercase; }
  .veil i { display:block; margin:18px auto 0; width:160px; height:2px; background:rgba(255,255,255,.12); overflow:hidden; border-radius:2px; }
  .veil i::before { content:""; display:block; width:40%; height:100%; background:var(--gold); animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-110%); } 100% { transform:translateX(270%); } }

  @media (max-width: 820px) {
    body { overflow:auto; }
    body.in-tour { overflow:hidden; }
    .cover { position:absolute; min-height:100%; height:auto; }
    .panel::after { background:linear-gradient(180deg, rgba(11,12,16,.5) 0%, rgba(11,12,16,.08) 26%, rgba(11,12,16,.8) 58%, rgba(11,12,16,.96) 100%); }
    .top { flex-direction:column; align-items:flex-start; }
    .lede { text-align:left; max-width:none; }
    .panels { flex-direction:column; gap:8px; }
    .panel { flex:none; height:44vh; min-height:330px; }
    .panel:hover, .panel:focus-visible { flex-grow:0; }
    .panel img { filter:saturate(1) brightness(.9); transform:none; }
    .badge { opacity:1; transform:none; }
    .more { grid-template-rows:1fr; }
    .foot { position:static; padding:14px 0 18px; }
    .tour { flex-direction:column; }
    .rail { width:100%; height:54px; flex-direction:row; padding:0 10px; border-right:0; border-bottom:1px solid var(--line); gap:4px; }
    .rail .home { margin:0 6px 0 0; width:40px; height:40px; }
    .tab { width:44px; height:40px; }
    .tab .tip, .rail .mark, .rail .spacer { display:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main class="cover" id="cover">
  <header class="top">
    <div class="brand">
      <small>Sensata Group · Алматы</small>
      <h1>Туры <em>360°</em></h1>
    </div>
    <p class="lede"><b>Жилые комплексы в одном окне.</b> Аэропанорамы, дворы, холлы и квартиры — выберите объект и переключайтесь между ними без перезагрузки.</p>
  </header>
  <nav class="panels" id="panels" aria-label="Жилые комплексы"></nav>
  <div class="foot" id="foot">Сборка от 25.11.2026</div>
</main>

<section class="tour" aria-label="Тур">
  <aside class="rail" id="rail">
    <button class="home" id="home" title="Все объекты" aria-label="Все объекты">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <div class="spacer"></div>
    <div class="mark">Sensata 360°</div>
  </aside>
  <div class="stage">
    <iframe id="frame" title="3D-тур" allow="fullscreen; gyroscope; accelerometer; clipboard-write" allowfullscreen></iframe>
    <div class="veil hide" id="veil"><div><b id="veilTitle"></b><i></i></div></div>
  </div>
</section>

<script>
  // The list of complexes lives in catalog.json: Studio adds and removes objects on the
  // host without rebuilding this page. The list baked in at build time is the fallback
  // (page opened from disk, catalog unreachable).
  const BAKED = [{"slug":"01_mangilik","title":"ЖК MÁŃGİLİK","badge":"Бизнес-класс","address":"ул. Ауэзова, 3г / ул. Гоголя","scenes":20,"zones":{"aero":3,"yard":1,"hall":8,"apartment":8},"cover":"01_mangilik/cover.webp","accent":"#c5a47e"},{"slug":"02_baiqadam","title":"ЖК BAIQADAM","badge":"Комфорт+","address":"ул. Розыбакиева / ул. Байкадамова","scenes":24,"zones":{"aero":3,"yard":1,"hall":10,"apartment":10},"cover":"02_baiqadam/cover.webp","accent":"#c5a47e"},{"slug":"03_nygmet","title":"ЖК NYGMET","badge":"Бизнес-класс","address":"ул. Нурмакова, 1а / ул. Гоголя","scenes":24,"zones":{"aero":2,"yard":6,"hall":9,"apartment":7},"cover":"03_nygmet/cover.webp","accent":"#c5a47e"},{"slug":"04_olympic_park","title":"ЖК OLYMPIC PARK","badge":"Комфорт-класс","address":"пр. Рыскулова / ул. Момышулы","scenes":19,"zones":{"aero":3,"yard":1,"hall":7,"apartment":8},"cover":"04_olympic_park/cover.webp","accent":"#c5a47e"},{"slug":"05_qaharman","title":"ЖК QAHARMAN","badge":"Комфорт-класс","address":"ул. Момышулы / пр. Рыскулова","scenes":18,"zones":{"aero":3,"yard":1,"hall":6,"apartment":8},"cover":"05_qaharman/cover.webp","accent":"#c5a47e"}];
  let TOURS = [];
  const $ = (id) => document.getElementById(id);
  const panels = $('panels'), rail = $('rail'), frame = $('frame'), veil = $('veil');
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plural = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'сцена' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'сцены' : 'сцен');
  const validEntry = (t) => t && typeof t.slug === 'string' && /^[a-z0-9][a-z0-9_-]{0,63}$/.test(t.slug) && typeof t.title === 'string' && t.zones && typeof t.cover === 'string';

  function start(list, updatedAt) {
  TOURS = list.filter(validEntry);
  if (updatedAt) $('foot').textContent = 'Обновлено ' + new Date(updatedAt).toLocaleDateString('ru-RU');
  if (!TOURS.length) panels.innerHTML = '<p class="empty">Объекты скоро появятся.</p>';
  TOURS.forEach((t, i) => {
    const no = String(i + 1).padStart(2, '0');
    const facts = [t.scenes + ' ' + plural(t.scenes), 'Аэро ' + t.zones.aero, 'Двор ' + t.zones.yard, 'Холлы ' + t.zones.hall, 'Квартира ' + t.zones.apartment];
    const p = document.createElement('button');
    p.className = 'panel';
    p.type = 'button';
    p.innerHTML =
      '<img src="' + esc(t.cover) + '" alt="" decoding="async" />' +
      '<span class="num">' + no + '</span>' +
      (t.badge ? '<span class="badge">' + esc(t.badge) + '</span>' : '') +
      '<span class="meta"><h2>' + esc(t.title) + '</h2><span class="more"><div>' +
      (t.address ? '<span class="addr">' + esc(t.address) + '</span>' : '') +
      '<span class="facts">' + facts.map((f) => '<span>' + esc(f) + '</span>').join('') + '</span>' +
      '<span class="go">Открыть тур<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>' +
      '</div></span></span>';
    p.addEventListener('click', () => { location.hash = t.slug; });
    panels.appendChild(p);

    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.type = 'button';
    tab.dataset.slug = t.slug;
    tab.setAttribute('aria-label', t.title);
    tab.innerHTML = no + '<span class="tip">' + esc(t.title) + '</span>';
    tab.addEventListener('click', () => { location.hash = t.slug; });
    rail.insertBefore(tab, rail.querySelector('.spacer'));
  });
  show(decodeURIComponent(location.hash.slice(1)));
  }

  let current = null;
  function show(slug) {
    const t = TOURS.find((x) => x.slug === slug);
    if (!t) {
      document.body.classList.remove('in-tour');
      document.title = 'Sensata Group — 3D-туры 360°';
      current = null;
      // free the WebGL context of the tour that was open
      setTimeout(() => { if (!current) frame.removeAttribute('src'); }, 500);
      return;
    }
    document.body.classList.add('in-tour');
    document.title = t.title + ' — 3D-тур 360° | Sensata Group';
    rail.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-current', String(b.dataset.slug === slug)));
    if (current === slug) return;
    current = slug;
    $('veilTitle').textContent = t.title;
    veil.classList.remove('hide');
    frame.src = './' + encodeURIComponent(slug) + '/index.html?fill=1';
  }
  frame.addEventListener('load', () => { if (current) setTimeout(() => veil.classList.add('hide'), 350); });
  // A sign in one tour opened a neighbouring complex inside the frame: follow it in the
  // tabs, title and address without loading the tour a second time
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (e.source !== frame.contentWindow || !d || d.source !== 'sensata-3d-tour' || d.type !== 'tour:openComplex') return;
    const t = TOURS.find((x) => x.slug === d.targetSlug);
    if (!t) return;
    current = t.slug;
    document.title = t.title + ' — 3D-тур 360° | Sensata Group';
    rail.querySelectorAll('.tab').forEach((b) => b.setAttribute('aria-current', String(b.dataset.slug === t.slug)));
    history.replaceState(null, '', '#' + encodeURIComponent(t.slug));
  });
  $('home').addEventListener('click', () => { history.pushState(null, '', location.pathname + location.search); show(null); });
  window.addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1))));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && current) $('home').click();
    const n = Number(e.key);
    if (n >= 1 && n <= TOURS.length && !e.ctrlKey && !e.metaKey && !e.altKey) location.hash = TOURS[n - 1].slug;
  });
  fetch('catalog.json', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.json() : null))
    .then((c) => (c && Array.isArray(c.objects) ? start(c.objects, c.updatedAt) : start(BAKED)))
    .catch(() => start(BAKED));
</script>
</body>
</html>
